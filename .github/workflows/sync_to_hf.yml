name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Push backend folder to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a fresh temporary repo with ONLY the backend folder contents
          cd backend
          git init --initial-branch main
          git lfs install
          git lfs track "*.pkl"
          git lfs track "*.h5"
          git add .
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" commit -m "Deploy backend $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force https://Shrizz999:$HF_TOKEN@huggingface.co/spaces/Shrizz999/shrizzfolio main